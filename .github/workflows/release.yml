# Releases the Romanian translation: Actions > Release > Run workflow with a tag v<port version>-ro<n> (v1.0.8-ro1).
# It checks out LoreanXavier/pt-pc at v<port version>, applies traducere/romana-<port version>.patch (the language wiring),
# copies traducere/romanian_text.h (the texts) over, builds traducere/ron.txt (Coffee with Lisa) into pt.exe, builds pt.exe and
# publishes a Release with only pt.exe and CITESTE-MA.txt. The release text is .github/romana/release.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag-ul Release-ului (v<versiune joc>-ro<n>)'
        required: true
        default: 'v1.0.8-ro1'
      publica:
        description: 'Publică Release-ul (debifat: doar compilează, pentru test)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)-ro\d+$') { throw "tag $tag is not v<x.y.z>-ro<n>" }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          "zip=PT-PC-Port-$($Matches[1])-Traducere-Romana.zip" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          path: traducere-repo

      - uses: actions/checkout@v4
        with:
          repository: LoreanXavier/pt-pc
          ref: v${{ steps.version.outputs.version }}
          path: pt-pc

      - name: Apply the translation
        shell: pwsh
        working-directory: pt-pc
        run: |
          $patch = "..\traducere-repo\traducere\romana-${{ steps.version.outputs.version }}.patch"
          if (-not (Test-Path $patch)) { throw "no patch for version ${{ steps.version.outputs.version }}: $patch" }
          git apply --whitespace=nowarn $patch
          if ($LASTEXITCODE) { throw "the patch does not apply to v${{ steps.version.outputs.version }}" }
          Copy-Item ..\traducere-repo\traducere\romanian_text.h src\engine\core\romanian_text.h -Force
          if (Test-Path src\game\lisa_date\lisa_date_romanian.h) {
            # Coffee with Lisa reads its text from the data pack (extras.pak), which has no Romanian: pt.exe carries ron.txt
            $utf8 = New-Object System.Text.UTF8Encoding $false
            $ron = [IO.File]::ReadAllText("..\traducere-repo\traducere\ron.txt", $utf8)
            if ($ron.Contains(')PT_RO"')) { throw "ron.txt cannot contain )PT_RO`"" }
            $header = "#pragma once`n#include <string_view>`n`nnamespace pt::game {`n// Coffee with Lisa in Romanian (language 14), built into the game: the data pack (extras.pak) has no text/ron.txt, so`n// LisaDate::LoadText takes this when the pack lacks the Romanian file. Generated from the translation's ron.txt.`ninline constexpr std::string_view kRomanianLisaDateText = R`"PT_RO(" + $ron + ")PT_RO`";`n}`n"
            [IO.File]::WriteAllText("src\game\lisa_date\lisa_date_romanian.h", $header, $utf8)
          }

      # The port's public source lacks three files its Windows build declares (tools/nr_native_companion_probe.cpp, the DLSS 5
      # companion pt-native-nvngx.dll; tools/dx12/spirv_to_hlsl.cpp, the DXIL shader translator; tests/unicode_paths_test.rc).
      # None of them goes into pt.exe: the companion DLL and the .dxil shaders come with the official install, which the
      # translation goes over. Stand-ins let CMake configure; the DXIL shaders are not rebuilt (PT_D3D12_SHADERS=OFF) and only
      # pt.exe is shipped.
      - name: Stand-ins for files missing upstream
        shell: pwsh
        working-directory: pt-pc
        run: |
          if (-not (Test-Path tools\nr_native_companion_probe.cpp)) {
            Set-Content tools\nr_native_companion_probe.cpp 'extern "C" __declspec(dllexport) int pt_companion_stand_in() { return 0; }'
          }
          if (-not (Test-Path tests\unicode_paths_test.rc)) { New-Item -ItemType File tests\unicode_paths_test.rc | Out-Null }
          "PT_D3D12_SHADERS=$((Test-Path tools\dx12\spirv_to_hlsl.cpp) ? 'ON' : 'OFF')" >> $env:GITHUB_ENV

      - name: Vulkan SDK
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\vulkan_sdk.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe?Human=true" -OutFile $installer
          & $installer --root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install | Out-Host
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Ninja
        run: pip install ninja

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        working-directory: pt-pc
        run: |
          set "PATH=C:\Program Files\LLVM\bin;%PATH%"
          cmake --preset release -B build\release -DPT_D3D12_SHADERS=%PT_D3D12_SHADERS% > ..\build.log 2>&1 || (type ..\build.log & exit /b 1)
          cmake --build build\release --target pt_release >> ..\build.log 2>&1 || (type ..\build.log & exit /b 1)

      - name: Diagnose
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) { exit 0 }
          $lines = Get-Content build.log
          $tail = ($lines | Select-Object -Last 30) -join ' | '
          Write-Output "::error::TAIL: $($tail.Substring([Math]::Max(0, $tail.Length - 3800)))"
          $hits = @()
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match 'CMake Error|FATAL|FAILED:|: error|error:|fatal error') {
              $hits += ($lines[$i..[Math]::Min($lines.Count-1,$i+6)] -join ' | ')
            }
          }
          foreach ($b in ($hits | Select-Object -First 8)) { Write-Output "::error::$($b.Substring(0, [Math]::Min(3500, $b.Length)))" }

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "${{ steps.version.outputs.zip }}"
          New-Item -ItemType Directory out\pkg | Out-Null
          Copy-Item pt-pc\build\release\pt_release.exe out\pkg\pt.exe
          if (Test-Path pt-pc\assets\lisa_date\text\ron.txt) {
            New-Item -ItemType Directory out\pkg\lisa_date\text | Out-Null
            Copy-Item pt-pc\assets\lisa_date\text\ron.txt out\pkg\lisa_date\text\ron.txt
          }
          $sha = (Get-FileHash out\pkg\pt.exe -Algorithm SHA256).Hash.ToLower()
          $utf8 = New-Object System.Text.UTF8Encoding $false
          function Fill($text) {
            $text.Replace('{{VERSION}}', $version).Replace('{{TAG}}', "${{ inputs.tag }}").Replace('{{ZIP}}', $zip).Replace('{{SHA256}}', $sha)
          }
          $guide = Fill ([IO.File]::ReadAllText("traducere-repo\.github\romana\CITESTE-MA.txt", $utf8))
          [IO.File]::WriteAllText("out\pkg\CITESTE-MA.txt", ($guide -replace "`r?`n", "`r`n"), $utf8)
          [IO.File]::WriteAllText("out\notes.md", (Fill ([IO.File]::ReadAllText("traducere-repo\.github\romana\release.md", $utf8))), $utf8)
          Compress-Archive -Path out\pkg\* -DestinationPath "out\$zip"

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.publica }}
        with:
          name: test-${{ inputs.tag }}
          path: out/

      - name: Release
        if: ${{ inputs.publica }}
        shell: pwsh
        working-directory: traducere-repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" "..\out\${{ steps.version.outputs.zip }}" --target "${{ github.sha }}" `
            --title "Traducere - P.T. (${{ steps.version.outputs.version }})" `
            --notes-file ..\out\notes.md --latest
